<!DOCTYPE html>
<!-- build trigger -->
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="造肉試算">
<title>肉豬造肉成本試算</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;font-size:13px;background:#F5F5F0;color:#1a1a1a;padding:20px}
.pg{max-width:960px;margin:0 auto}
.sec{font-size:14px;font-weight:500;margin-bottom:10px;margin-top:18px}
.sec-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;margin-top:18px}
.sec-row .sec{margin:0}
.mode-toggle{display:flex;background:#E0E0DC;border-radius:10px;padding:3px;gap:3px;width:fit-content;margin-bottom:10px}
.mode-btn{padding:7px 24px;border:none;border-radius:8px;font-size:13px;cursor:pointer;font-weight:500;background:transparent;color:#888;transition:all .15s}
.mode-btn.active{background:#fff;color:#1a1a1a;box-shadow:0 1px 4px rgba(0,0,0,0.12)}
.adv-hint{font-size:12px;color:#555;margin-bottom:16px;line-height:1.9}
.adv-hr{border:none;border-top:1.5px solid rgba(0,0,0,0.13);margin:6px 0}
.feeds{display:grid;gap:12px}
.fcard{background:#fff;border:0.5px solid rgba(0,0,0,0.12);border-radius:12px;padding:14px}
.fcard.off .fbody{display:none}
.fcard.off .fhdr{margin-bottom:0}
.fhdr{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.fhdr input[type=checkbox]{accent-color:#378ADD;width:16px;height:16px;cursor:pointer;flex-shrink:0}
.fname-wrap{display:flex;align-items:center;gap:3px;flex:1;min-width:0;border-bottom:1px dashed rgba(0,0,0,0.2)}
.fname-wrap:focus-within{border-bottom-color:#378ADD}
.fname-icon{font-size:11px;color:#bbb;flex-shrink:0}
.fname{font-size:14px;font-weight:500;border:none;background:transparent;color:#1a1a1a;outline:none;flex:1;min-width:0;padding:1px 2px}
.rm-btn{background:#F0F0EC;border:0.5px solid rgba(0,0,0,0.15);cursor:pointer;font-size:13px;color:#999;padding:3px 7px;border-radius:5px;flex-shrink:0;line-height:1;transition:all .15s;font-weight:600}
.rm-btn:hover{color:#A32D2D;background:#FCE8E8;border-color:#A32D2D}
.add-btn{padding:5px 14px;border:none;border-radius:8px;background:#378ADD;color:#fff;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;transition:all .15s}
.add-btn:hover{background:#2772C3}
.add-btn:disabled{background:#ccc;cursor:not-allowed}
.field-row{display:flex;gap:8px;margin-bottom:10px;align-items:flex-end}
.field-row-bot{display:flex;gap:8px;margin-top:10px}
.cf-field{flex:1;display:flex;flex-direction:column;gap:3px}
.cf-field label{font-size:11px;color:#777;white-space:nowrap}
.cf-field input{width:100%;font-size:14px;padding:6px 8px;border-radius:8px;border:0.5px solid rgba(0,0,0,0.15);background:#fff;color:#1a1a1a;text-align:center}
.cf-field input:focus{outline:none;border-color:#378ADD}
.num-wrap{display:flex;align-items:stretch;gap:2px}
.num-wrap input{flex:1;min-width:48px}
.step-btn{display:none}
@media (hover:none) and (pointer:coarse){
  .step-btn{background:#F0F0EC;border:0.5px solid rgba(0,0,0,0.15);border-radius:7px;font-size:17px;font-weight:300;color:#444;cursor:pointer;padding:0 8px;flex-shrink:0;-webkit-user-select:none;user-select:none;display:flex;align-items:center;justify-content:center;touch-action:manipulation}
  .step-btn:active{background:#D8D8D4}
}
.trio-item .num-wrap input{border-radius:6px}
.mkt-field input{border-color:rgba(29,158,117,0.4)!important;background:#F0F8F4}
.mkt-field input:focus{border-color:#1D9E75!important;background:#fff}
.mkt-field label{color:#0F6E56!important;font-weight:500}
.trio-box{background:#F5F5F0;border-radius:8px;padding:10px;margin-bottom:10px}
.trio-row{display:flex;gap:7px;margin-bottom:8px}
.trio-item{flex:1;display:flex;flex-direction:column;border-radius:6px;padding:2px 3px;transition:background .2s}
.trio-item label{font-size:10px;color:#777;margin-bottom:3px;display:flex;align-items:center;gap:7px;white-space:nowrap;transition:color .2s}
.trio-item input{width:100%;font-size:14px;padding:6px 7px;border-radius:8px;border:0.5px solid rgba(0,0,0,0.15);background:#fff;color:#1a1a1a;text-align:center;transition:border-color .2s,background .2s,color .2s}
.trio-item input.locked-inp{border-color:rgba(55,138,221,0.5);background:#FAFCFF}
.trio-item input.auto-inp{background:#EFEFEC;color:#888;border-color:rgba(0,0,0,0.08)}
.trio-item input:focus{outline:none;border-color:#378ADD;background:#fff;color:#1a1a1a}
.trio-item.field-indiv{background:#F0F4F8}
.trio-item.field-indiv label{color:#3B5F8A!important}
.trio-item.field-indiv input{background:#E2EAF4!important;border-color:#93B4D6!important;color:#2C4F72!important}
.trio-item.field-locked{background:#FEF9EE}
.trio-item.field-locked label{color:#B45309!important}
.trio-item.field-locked input{background:#FEF3C7!important;border-color:#F59E0B!important;color:#92400E!important}
.lock-btn{background:none;border:none;cursor:pointer;font-size:12px;padding:0;line-height:1;flex-shrink:0;transition:all .15s;opacity:0.35}
.lock-btn:hover{opacity:0.9}
.lock-btn.locked{opacity:1;filter:sepia(1) saturate(2) hue-rotate(190deg)}
.glock-btn{background:#E8E8E4;border:0.5px solid rgba(0,0,0,0.12);cursor:pointer;font-size:9px;font-weight:600;padding:1px 5px;border-radius:4px;color:#888;line-height:1.4;flex-shrink:0;transition:all .15s;white-space:nowrap}
.glock-btn:hover{background:#FEF9EE;color:#B45309;border-color:#F59E0B}
.glock-btn.glocked{background:#FEF3C7;color:#92400E;border-color:#F59E0B}
.state-badge{font-size:9px;font-weight:500;padding:2px 6px;border-radius:5px;margin-top:4px;display:inline-block}
.state-badge.locked{background:#E6F1FB;color:#0C447C}
.state-badge.auto{background:#EBEBEB;color:#aaa}
.fcr-auto-tag{font-size:8px;background:#EBEBEB;color:#aaa;padding:1px 5px;border-radius:4px;margin-left:2px}
.link-row{display:flex;align-items:center;gap:6px;margin-top:4px}
.link-lbl{font-size:9.5px;color:#999;white-space:nowrap}
.link-btns{display:flex;gap:3px}
.link-btn{font-size:9.5px;padding:2px 8px;border-radius:5px;border:0.5px solid rgba(0,0,0,0.15);background:#F0F0EC;color:#888;cursor:pointer;transition:all .15s;font-weight:500}
.link-btn.active{background:#E6F1FB;color:#0C447C;border-color:rgba(55,138,221,0.4);font-weight:600}
.results{display:grid;gap:12px}
.rcard{background:#fff;border-radius:12px;border:0.5px solid rgba(0,0,0,0.12);padding:16px}
.rcard.best{border-top:3px solid #1D9E75}
.rcard-name{font-size:12px;color:#777;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.badge{font-size:10px;color:#0F6E56;background:#E1F5EE;padding:2px 7px;border-radius:10px;font-weight:500}
.hdr-badge{font-size:9px;padding:2px 6px}
.calc-box{background:#F8F8F6;border-radius:8px;padding:10px 12px;margin-bottom:8px}
.cline{display:flex;justify-content:space-between;font-size:12px;padding:3px 0}
.cline .lbl{color:#777}
.cline .val{font-weight:500}
.cline .neg{color:#A32D2D}
.divider{border:none;border-top:0.5px solid rgba(0,0,0,0.1);margin:5px 0}
.profit-row{display:flex;justify-content:space-between;align-items:baseline;padding-top:6px}
.profit-lbl{font-size:12px;color:#777}
.profit-val{font-size:22px;font-weight:500}
.profit-val.pos{color:#0F6E56}
.profit-val.neg{color:#A32D2D}
.bep-box{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:8px;border:0.5px solid rgba(0,0,0,0.1);background:#F8F8F6}
.bep-lbl{font-size:11px;color:#777;margin-bottom:2px}
.bep-val{font-size:14px;font-weight:500}
.bep-gap{font-size:11px;margin-left:5px}
.bep-gap.pos{color:#0F6E56}
.bep-gap.neg{color:#A32D2D}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;align-items:center}
.action-btn{padding:9px 16px;border:none;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;transition:all .15s}
.btn-save{background:#1D9E75;color:#fff}.btn-save:hover{background:#16896A}
.btn-export-all{background:#378ADD;color:#fff}.btn-export-all:hover{background:#2772C3}
.btn-export{background:#F0F0EC;color:#555;border:0.5px solid rgba(0,0,0,0.15)}.btn-export:hover{background:#E0E0DC}
.btn-clear{background:none;color:#ccc;border:0.5px solid rgba(0,0,0,0.12);font-size:12px;padding:7px 12px}.btn-clear:hover{color:#A32D2D;border-color:#A32D2D}
.rec-count{font-size:11px;color:#aaa;margin-left:4px}
@media(max-width:600px){.feeds{grid-template-columns:1fr!important}.results{grid-template-columns:1fr!important}.field-row{flex-wrap:wrap}.field-row .cf-field{flex:0 0 calc(50% - 4px)}.field-row .cf-field:last-child:nth-child(odd){flex:0 0 100%}.btn-row{gap:6px}.action-btn{font-size:12px;padding:8px 12px}}
</style>
</head>
<body>
<div class="pg">
  <div class="mode-toggle">
    <button class="mode-btn active" id="btn-simple" onclick="setAppMode('simple')">一般模式</button>
    <button class="mode-btn" id="btn-advanced" onclick="setAppMode('advanced')">進階模式</button>
  </div>
  <div id="adv-hint" style="display:none">
    <div class="adv-hr"></div>
    <div style="font-size:12px;color:#555;line-height:1.9;padding:2px 0">
      <strong>進階模式</strong><br>
      🔓：鎖定單一飼料欄位（<span style="color:#3B5F8A">藍灰</span>），仍可設定連動方式。<br>
      全：同步所有飼料欄位為相同數值（鎖定），並可設定連動方式。
    </div>
    <div class="adv-hr"></div>
  </div>
  <div class="sec-row">
    <p class="sec" style="margin:0">飼料設定</p>
    <button class="add-btn" id="add-feed-btn" onclick="addFeed()">＋ 新增比較</button>
  </div>
  <div class="feeds" id="feeds"></div>
  <p class="sec">損益分析</p>
  <div class="results" id="results"></div>
  <div class="btn-row">
    <button class="action-btn btn-save" onclick="saveRecord()">💾 儲存此次記錄</button>
    <button class="action-btn btn-export-all" onclick="exportAllRecords()">📊 匯出全部記錄</button>
    <button class="action-btn btn-export" onclick="exportExcel()">⬇ 匯出本次</button>
    <button class="action-btn btn-clear" onclick="clearRecords()">🗑 清除記錄</button>
    <span class="rec-count" id="rec-count"></span>
  </div>
</div>
<script>
const ACC=['#378ADD','#1D9E75','#D85A30','#9B59B6','#E67E22','#E91E8C'];
const FEED_LABELS=['A','B','C','D','E','F'];
const MAX_FEEDS=6;
const STORAGE_KEY='pigCalcRecords';
let appMode='simple';
let daysLocked=false,woutLocked=false,adfiGlobalLocked=false;
let lockedDaysVal=110,lockedWoutVal=125,lockedAdfiVal=2.2;
let indivLock=[],adfiLocked_f=[],af_indiv=[],af_adfi_f=[];
let feedCount=1;
let fnames=['飼料 A'];
let fen=[true],price=[12.5],adfi=[2.2],fcr=[2.7];
let win_pf=[25],piglet_pf=[5000],days_pf=[110],wout_pf=[125];
let mktPrice=[85],af=[1],notes=[''];
indivLock=[null];adfiLocked_f=[false];af_indiv=[1];af_adfi_f=[1];
function setVal(id,val){const el=document.getElementById(id);if(el)el.value=val;}
function stepVal(id,delta,mn,mx){const el=document.getElementById(id);if(!el)return;const v=Math.min(mx,Math.max(mn,+(+el.value+delta).toFixed(4)));el.value=v;}
function setupScrub(){document.querySelectorAll('#feeds input[type=number]:not([disabled])').forEach(function(el){if(el._scrub)return;el._scrub=true;var sx=0,sv=0,moving=false;el.addEventListener('touchstart',function(e){sx=e.touches[0].clientX;sv=+el.value;moving=false;},{passive:true});el.addEventListener('touchmove',function(e){var dx=e.touches[0].clientX-sx;if(!moving&&Math.abs(dx)>8){moving=true;el.blur();}if(!moving)return;e.preventDefault();var st=+(el.step)||0.1;var mn=el.min!==''?+el.min:0;var mx=el.max!==''?+el.max:9999;var snapped=Math.round((sv+(dx/15)*st)/st)*st;el.value=+(Math.min(mx,Math.max(mn,snapped)).toFixed(4));},{passive:false});el.addEventListener('touchend',function(){if(moving)el.dispatchEvent(new Event('change'));moving=false;});});}
function getGlobalMode(){return(appMode==='advanced'&&daysLocked)?'days':(appMode==='advanced'&&woutLocked)?'wout':'free';}
function getFeedMode(f){const gm=getGlobalMode();if(gm!=='free')return gm;if(appMode==='advanced'&&indivLock[f])return 'indiv_'+indivLock[f];return 'free';}
function setAppMode(m){appMode=m;document.getElementById('btn-simple').className='mode-btn'+(m==='simple'?' active':'');document.getElementById('btn-advanced').className='mode-btn'+(m==='advanced'?' active':'');document.getElementById('adv-hint').style.display=m==='advanced'?'':'none';if(m==='simple'){daysLocked=false;woutLocked=false;adfiGlobalLocked=false;indivLock=Array(feedCount).fill(null);adfiLocked_f=Array(feedCount).fill(false);af_indiv=Array(feedCount).fill(1);af_adfi_f=Array(feedCount).fill(1);}buildFeeds();calc();}
function addFeed(){if(feedCount>=MAX_FEEDS)return;const p=feedCount-1;fnames.push('飼料 '+FEED_LABELS[feedCount]);fen.push(true);price.push(price[p]);adfi.push(adfi[p]);fcr.push(fcr[p]);win_pf.push(win_pf[p]);piglet_pf.push(piglet_pf[p]);days_pf.push(days_pf[p]);wout_pf.push(wout_pf[p]);mktPrice.push(mktPrice[p]);af.push(1);notes.push('');indivLock.push(null);adfiLocked_f.push(false);af_indiv.push(1);af_adfi_f.push(1);feedCount++;updateAddBtn();buildFeeds();calc();}
function removeFeed(f){if(!confirm('確定移除「'+fnames[f]+'」？'))return;fnames.splice(f,1);fen.splice(f,1);price.splice(f,1);adfi.splice(f,1);fcr.splice(f,1);win_pf.splice(f,1);piglet_pf.splice(f,1);days_pf.splice(f,1);wout_pf.splice(f,1);mktPrice.splice(f,1);af.splice(f,1);notes.splice(f,1);indivLock.splice(f,1);adfiLocked_f.splice(f,1);af_indiv.splice(f,1);af_adfi_f.splice(f,1);feedCount--;if(daysLocked||woutLocked)af=Array(feedCount).fill(1);updateAddBtn();buildFeeds();calc();}
function updateAddBtn(){const b=document.getElementById('add-feed-btn');if(b)b.disabled=(feedCount>=MAX_FEEDS);}
function toggleIndivDays(f){if(getGlobalMode()!=='free')return;if(indivLock[f]==='days'){indivLock[f]=null;}else{indivLock[f]='days';adfiLocked_f[f]=false;af_indiv[f]=1;}buildFeeds();syncAutoIndiv(f);calc();}
function toggleIndivWout(f){if(getGlobalMode()!=='free')return;if(indivLock[f]==='wout'){indivLock[f]=null;}else{indivLock[f]='wout';adfiLocked_f[f]=false;af_indiv[f]=1;}buildFeeds();syncAutoIndiv(f);calc();}
function toggleIndivAdfi(f){if(adfiLocked_f[f]){adfiLocked_f[f]=false;}else{adfiLocked_f[f]=true;indivLock[f]=null;af_adfi_f[f]=1;}buildFeeds();if(adfiLocked_f[f])syncAutoAdfiIndiv(f);calc();}
function setAutoIndiv(f,v){if(v===2&&adfiGlobalLocked)return;af_indiv[f]=v;syncAutoIndiv(f);buildFeeds();calc();}
function setAutoAdfiIndiv(f,v){af_adfi_f[f]=v;syncAutoAdfiIndiv(f);buildFeeds();calc();}
function toggleDaysLock(f){if(daysLocked){daysLocked=false;}else{lockedDaysVal=days_pf[f];for(let i=0;i<feedCount;i++)days_pf[i]=lockedDaysVal;daysLocked=true;woutLocked=false;af=Array(feedCount).fill(1);}buildFeeds();for(let i=0;i<feedCount;i++)if(fen[i])syncAutoGlobal(i);calc();}
function toggleWoutLock(f){if(woutLocked){woutLocked=false;}else{lockedWoutVal=wout_pf[f];for(let i=0;i<feedCount;i++)wout_pf[i]=lockedWoutVal;woutLocked=true;daysLocked=false;af=Array(feedCount).fill(1);}buildFeeds();for(let i=0;i<feedCount;i++)if(fen[i])syncAutoGlobal(i);calc();}
function toggleAdfiGlobalLock(f){if(adfiGlobalLocked){adfiGlobalLocked=false;}else{lockedAdfiVal=adfi[f];for(let i=0;i<feedCount;i++)adfi[i]=lockedAdfiVal;adfiGlobalLocked=true;}buildFeeds();calc();}
function setAutoGlobal(f,v){if(v===2&&adfiGlobalLocked)return;af[f]=v;syncAutoGlobal(f);buildFeeds();calc();}
function syncAutoGlobal(f){const mode=getGlobalMode();if(mode==='free')return;const aV=adfiGlobalLocked?lockedAdfiVal:adfi[f];if(mode==='days'){const d=lockedDaysVal,g=wout_pf[f]-win_pf[f];if(af[f]===0){if(fcr[f]>0){wout_pf[f]=+(win_pf[f]+aV*d/fcr[f]).toFixed(1);}setVal('wout-'+f,wout_pf[f]);}else if(af[f]===1){if(g>0){fcr[f]=+(aV*d/g).toFixed(2);}setVal('fcr-'+f,fcr[f]);}else{if(d>0&&g>0){adfi[f]=+(fcr[f]*g/d).toFixed(2);}setVal('adfi-'+f,adfi[f]);}}else{const g=lockedWoutVal-win_pf[f];if(g<=0)return;if(af[f]===0){if(aV>0&&fcr[f]>0){days_pf[f]=Math.round(fcr[f]*g/aV);}setVal('days-'+f,days_pf[f]);}else if(af[f]===1){if(days_pf[f]>0){fcr[f]=+(aV*days_pf[f]/g).toFixed(2);}setVal('fcr-'+f,fcr[f]);}else{if(days_pf[f]>0){adfi[f]=+(fcr[f]*g/days_pf[f]).toFixed(2);}setVal('adfi-'+f,adfi[f]);}}}
function syncAutoIndiv(f){if(!indivLock[f]||getGlobalMode()!=='free')return;const aV=adfiGlobalLocked?lockedAdfiVal:adfi[f];const v=af_indiv[f];if(indivLock[f]==='days'){const d=days_pf[f],g=wout_pf[f]-win_pf[f];if(v===0){if(fcr[f]>0){wout_pf[f]=+(win_pf[f]+aV*d/fcr[f]).toFixed(1);}setVal('wout-'+f,wout_pf[f]);}else if(v===1){if(g>0){fcr[f]=+(aV*d/g).toFixed(2);}setVal('fcr-'+f,fcr[f]);}else{if(d>0&&g>0){adfi[f]=+(fcr[f]*g/d).toFixed(2);}setVal('adfi-'+f,adfi[f]);}}else{const g=wout_pf[f]-win_pf[f];if(g<=0)return;if(v===0){if(aV>0&&fcr[f]>0){days_pf[f]=Math.round(fcr[f]*g/aV);}setVal('days-'+f,days_pf[f]);}else if(v===1){if(days_pf[f]>0){fcr[f]=+(aV*days_pf[f]/g).toFixed(2);}setVal('fcr-'+f,fcr[f]);}else{if(days_pf[f]>0){adfi[f]=+(fcr[f]*g/days_pf[f]).toFixed(2);}setVal('adfi-'+f,adfi[f]);}}}
function syncAutoAdfiIndiv(f){if(!adfiLocked_f[f]||adfiGlobalLocked||getGlobalMode()!=='free'||indivLock[f])return;const aV=adfi[f],v=af_adfi_f[f],g=wout_pf[f]-win_pf[f];if(v===0){if(fcr[f]>0&&days_pf[f]>0){wout_pf[f]=+(win_pf[f]+aV*days_pf[f]/fcr[f]).toFixed(1);}setVal('wout-'+f,wout_pf[f]);}else if(v===1){if(g>0&&days_pf[f]>0){fcr[f]=+(aV*days_pf[f]/g).toFixed(2);}setVal('fcr-'+f,fcr[f]);}else{if(aV>0&&g>0&&fcr[f]>0){days_pf[f]=Math.round(fcr[f]*g/aV);}setVal('days-'+f,days_pf[f]);}}
function updateUIGlobal(f){const mode=getGlobalMode();if(mode==='free')return;const ids=mode==='days'?['wout','fcr','adfi']:['days','fcr','adfi'];ids.forEach((id,i)=>{const isAuto=(af[f]===i),inp=document.getElementById(id+'-'+f),bdg=document.getElementById('bg-'+id+'-'+f),btn=document.getElementById('lnk-'+id+'-'+f);if(inp){inp.className=isAuto?'auto-inp':'locked-inp';inp.disabled=isAuto;}if(bdg){bdg.className='state-badge '+(isAuto?'auto':'locked');bdg.textContent=isAuto?'↻ 連動':'';}if(btn)btn.className='link-btn'+(isAuto?' active':'');});}

  setupScrub();
}
function calcFeed(f){const fm=getFeedMode(f);const aV=adfiGlobalLocked?lockedAdfiVal:adfi[f];let woutF,daysF,g;if(fm==='days'){daysF=lockedDaysVal;if(af[f]===0){if(fcr[f]<=0)return null;woutF=+(win_pf[f]+aV*daysF/fcr[f]).toFixed(1);}else woutF=wout_pf[f];g=woutF-win_pf[f];if(g<=0)return null;if(af[f]===1)fcr[f]=+(aV*daysF/g).toFixed(2);else if(af[f]===2&&!adfiGlobalLocked)adfi[f]=+(fcr[f]*g/daysF).toFixed(2);}else if(fm==='wout'){woutF=lockedWoutVal;g=woutF-win_pf[f];if(g<=0)return null;if(af[f]===0){if(aV<=0||fcr[f]<=0)return null;daysF=+(fcr[f]*g/aV).toFixed(1);}else daysF=days_pf[f];if(af[f]===1)fcr[f]=+(aV*daysF/g).toFixed(2);else if(af[f]===2&&!adfiGlobalLocked)adfi[f]=+(fcr[f]*g/daysF).toFixed(2);}else if(fm==='indiv_days'){const v=af_indiv[f];daysF=days_pf[f];if(v===0){if(fcr[f]<=0)return null;woutF=+(win_pf[f]+aV*daysF/fcr[f]).toFixed(1);wout_pf[f]=woutF;}else woutF=wout_pf[f];g=woutF-win_pf[f];if(g<=0)return null;if(v===1)fcr[f]=+(aV*daysF/g).toFixed(2);else if(v===2&&!adfiGlobalLocked)adfi[f]=+(fcr[f]*g/daysF).toFixed(2);}else if(fm==='indiv_wout'){const v=af_indiv[f];woutF=wout_pf[f];g=woutF-win_pf[f];if(g<=0)return null;if(v===0){if(aV<=0||fcr[f]<=0)return null;daysF=+(fcr[f]*g/aV).toFixed(1);days_pf[f]=+daysF;}else daysF=days_pf[f];if(v===1)fcr[f]=+(aV*daysF/g).toFixed(2);else if(v===2&&!adfiGlobalLocked)adfi[f]=+(fcr[f]*g/daysF).toFixed(2);}else{const aIA=adfiLocked_f[f]&&!adfiGlobalLocked&&appMode==='advanced';if(aIA){const v=af_adfi_f[f];woutF=wout_pf[f];daysF=days_pf[f];if(v===0){if(fcr[f]<=0||daysF<=0)return null;woutF=+(win_pf[f]+aV*daysF/fcr[f]).toFixed(1);wout_pf[f]=woutF;}g=woutF-win_pf[f];if(g<=0)return null;if(v===2){if(aV<=0||fcr[f]<=0)return null;daysF=Math.round(fcr[f]*g/aV);days_pf[f]=daysF;}if(v===1)fcr[f]=+(aV*daysF/g).toFixed(2);}else{woutF=wout_pf[f];daysF=days_pf[f];g=woutF-win_pf[f];if(g<=0)return null;fcr[f]=+(aV*daysF/g).toFixed(2);}}if(!daysF||daysF<=0||!g||g<=0||fcr[f]<=0)return null;const feedCost=price[f]*fcr[f]*g;const pigletCost=piglet_pf[f];const sale=mktPrice[f]*woutF;const profit=sale-feedCost-pigletCost;const bep=(feedCost+pigletCost)/woutF;const cpk=feedCost/g;return{feedCost,pigletCost,sale,profit,bep,cpk,g,daysF,woutF};}
function calc(){const res=[];for(let f=0;f<feedCount;f++){if(fen[f]){const r=calcFeed(f);if(r)res.push({f,name:fnames[f],...r});}}for(let f=0;f<feedCount;f++){const bb=document.getElementById('best-badge-'+f);if(bb)bb.innerHTML='';}const el=document.getElementById('results');if(!res.length){el.innerHTML='<p style="font-size:12px;color:#888">請啟用至少一個飼料</p>';return;}const badgeMap={};if(res.length>1){const maxP=Math.max(...res.map(r=>Math.round(r.profit)));const top=res.filter(r=>Math.round(r.profit)===maxP);if(top.length<res.length){const txt=top.length>1?'最高毛利(平分)':'最高毛利';top.forEach(r=>{badgeMap[r.f]=txt;});}}el.style.gridTemplateColumns='repeat('+Math.min(res.length,3)+',1fr)';el.innerHTML=res.map(r=>{const badge=badgeMap[r.f]||'',isBest=!!badge;const profPos=r.profit>=0,gap=mktPrice[r.f]-r.bep;const bb=document.getElementById('best-badge-'+r.f);if(bb)bb.innerHTML=badge?'<span class="badge hdr-badge">'+badge+'</span>':'';return '<div class="rcard'+(isBest?' best':'')+'"><div class="rcard-name">'+r.name+(badge?'<span class="badge">'+badge+'</span>':'')+'</div><div class="calc-box"><div class="cline"><span class="lbl">毛豬售價</span><span class="val">'+r.sale.toFixed(0)+' 元/頭</span></div><div class="cline"><span class="lbl">飼料費</span><span class="val neg">− '+r.feedCost.toFixed(0)+' 元</span></div><div class="cline"><span class="lbl">小豬成本</span><span class="val neg">− '+r.pigletCost.toFixed(0)+' 元</span></div><hr class="divider"><div class="profit-row"><span class="profit-lbl">毛利/頭</span><span class="profit-val '+(profPos?'pos':'neg')+'">'+(profPos?'+':'')+r.profit.toFixed(0)+' 元</span></div></div><div class="bep-box"><div><div class="bep-lbl">損益點牌價</div><span class="bep-val">'+r.bep.toFixed(1)+' 元/kg</span><span class="bep-gap '+(gap>=0?'pos':'neg')+'">'+(gap>=0?'▲':'▼')+Math.abs(gap).toFixed(1)+' 元</span></div><div style="text-align:right"><div class="bep-lbl">造肉成本</div><span class="bep-val">'+r.cpk.toFixed(2)+' 元/kg</span></div></div></div>';}).join('');}
function getTimestamp(){const d=new Date();return d.getFullYear()+'/'+(('0'+(d.getMonth()+1)).slice(-2))+'/'+(('0'+d.getDate()).slice(-2))+' '+(('0'+d.getHours()).slice(-2))+':'+(('0'+d.getMinutes()).slice(-2));}
function updateRecCount(){const records=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');const el=document.getElementById('rec-count');if(el)el.textContent=records.length?'已儲存 '+records.length+' 筆':'';}
function saveRecord(){const records=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');const ts=getTimestamp();let saved=0;for(let f=0;f<feedCount;f++){if(!fen[f])continue;const r=calcFeed(f);if(!r)continue;records.push({時間:ts,飼料名稱:fnames[f],入重:win_pf[f],小豬成本:piglet_pf[f],飼料價格:price[f],出重:+r.woutF.toFixed(1),採食量:+adfi[f].toFixed(2),飼養天數:+r.daysF.toFixed(0),FCR:+fcr[f].toFixed(2),出豬牌價:mktPrice[f],毛豬售價:+r.sale.toFixed(0),飼料費:+r.feedCost.toFixed(0),毛利:+r.profit.toFixed(0),損益點牌價:+r.bep.toFixed(1),造肉成本:+r.cpk.toFixed(2),備註:notes[f]});saved++;}if(!saved){alert('無可儲存的有效試算結果');return;}localStorage.setItem(STORAGE_KEY,JSON.stringify(records));updateRecCount();alert('✅ 已儲存 '+saved+' 筆記錄（'+ts+'）
累計共 '+records.length+' 筆');}
function exportAllRecords(){const records=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');if(!records.length){alert('尚無儲存記錄，請先按「儲存此次記錄」');return;}const headers=['時間','飼料名稱','入重(kg)','小豬成本(元)','飼料價格(元/kg)','出重(kg)','採食量(kg/天)','飼養天數(天)','FCR','出豬牌價(元/kg)','毛豬售價(元)','飼料費(元)','毛利(元)','損益點牌價(元/kg)','造肉成本(元/kg)','備註'];const rows=[headers];records.forEach(r=>rows.push([r.時間,r.飼料名稱,r.入重,r.小豬成本,r.飼料價格,r.出重,r.採食量,r.飼養天數,r.FCR,r.出豬牌價,r.毛豬售價,r.飼料費,r.毛利,r.損益點牌價,r.造肉成本,r.備註]));const ws=XLSX.utils.aoa_to_sheet(rows);ws['!cols']=[{wch:16},{wch:12},{wch:9},{wch:13},{wch:15},{wch:9},{wch:14},{wch:13},{wch:7},{wch:15},{wch:12},{wch:10},{wch:10},{wch:16},{wch:14},{wch:24}];const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'造肉成本記錄');const d=new Date();const ds=d.getFullYear()+(('0'+(d.getMonth()+1)).slice(-2))+(('0'+d.getDate()).slice(-2));XLSX.writeFile(wb,'造肉成本記錄_'+ds+'.xlsx');}
function exportExcel(){const rows=[['飼料名稱','入重(kg)','小豬成本(元)','飼料價格(元/kg)','出重(kg)','採食量(kg/天)','飼養天數(天)','FCR','出豬牌價(元/kg)','毛豬售價(元)','飼料費(元)','小豬成本(元)','毛利(元)','損益點牌價(元/kg)','造肉成本(元/kg)','備註']];for(let f=0;f<feedCount;f++){if(!fen[f])continue;const r=calcFeed(f);if(!r)continue;rows.push([fnames[f],win_pf[f],piglet_pf[f],price[f],+r.woutF.toFixed(1),+adfi[f].toFixed(2),+r.daysF.toFixed(0),+fcr[f].toFixed(2),mktPrice[f],+r.sale.toFixed(0),+r.feedCost.toFixed(0),+r.pigletCost.toFixed(0),+r.profit.toFixed(0),+r.bep.toFixed(1),+r.cpk.toFixed(2),notes[f]]);}const ws=XLSX.utils.aoa_to_sheet(rows);ws['!cols']=[{wch:12},{wch:9},{wch:13},{wch:15},{wch:9},{wch:14},{wch:13},{wch:7},{wch:15},{wch:12},{wch:10},{wch:12},{wch:10},{wch:16},{wch:14},{wch:24}];const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'造肉成本試算');const d=new Date();const ds=d.getFullYear()+(('0'+(d.getMonth()+1)).slice(-2))+(('0'+d.getDate()).slice(-2));XLSX.writeFile(wb,'造肉成本試算_'+ds+'.xlsx');}
function clearRecords(){const records=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');if(!records.length){alert('目前沒有儲存的記錄');return;}if(!confirm('確定清除全部 '+records.length+' 筆儲存記錄？此動作無法復原。'))return;localStorage.removeItem(STORAGE_KEY);updateRecCount();alert('記錄已清除');}
buildFeeds();calc();updateRecCount();
